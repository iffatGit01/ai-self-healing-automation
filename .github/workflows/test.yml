name: AI Self-Healing Automation Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # allows manual trigger from GitHub UI

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── 1. Checkout Code ──────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Python ───────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # ── 3. Install Dependencies ───────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── 4. Install Playwright Browsers ────────────────────────
      - name: Install Playwright browsers
        run: |
          playwright install chromium
          playwright install-deps chromium

      # ── 5. Install Ollama ─────────────────────────────────────
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      # ── 6. Start Ollama & Pull Model ──────────────────────────
      - name: Start Ollama and pull llama3.2
        run: |
          ollama serve &
          sleep 5
          ollama pull llama3.2
          echo "Ollama ready ✅"

      # ── 7. Start Banking App ──────────────────────────────────
      - name: Start Banking App
        run: |
          cd App/Bank_App
          python -m http.server 5500 &
          sleep 3
          echo "Banking App running on port 5500 ✅"

      # ── 8. Verify App is Running ──────────────────────────────
      - name: Verify app is accessible
        run: |
          curl -f http://localhost:5500 || exit 1
          echo "App is accessible ✅"

      # ── 9. Run Tests ──────────────────────────────────────────
      - name: Run Playwright tests
        run: |
          pytest automation/tests/ \
            --alluredir=allure-results \
            -v -s \
            --tb=short
        env:
          BASE_URL: http://localhost:5500
          BROWSER: chromium
          HEADLESS: true
          OLLAMA_BASE_URL: http://localhost:11434
          OLLAMA_MODEL: llama3.2
          LLM_PROVIDER: ollama
          HEALING_ENABLED: true
          HEALING_MAX_RETRIES: 3

      # ── 10. Upload Allure Results ─────────────────────────────
      - name: Upload allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30

      # ── 11. Upload Screenshots on Failure ─────────────────────
      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failure-screenshots
          path: allure-results/*.png
          retention-days: 7

  # ── Allure Report Job ────────────────────────────────────────
  report:
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results/

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: allure-results
          allure_report: allure-report
          allure_history: allure-history

      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report