<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Simple Banking App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- LOGIN SECTION -->
  <div id="login-section">
    <div class="card" id="login-card">
      <h1>🏦 TEST Bank</h1>
      <h2>Login</h2>
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter username" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password" />
      </div>
      <button id="login-btn" onclick="login()">Login</button>
      <p id="login-error" class="error hidden"></p>
    </div>
  </div>

  <!-- DASHBOARD SECTION -->
  <div id="dashboard-section" class="hidden">
    <div class="header">
      <h1>🏦 Simple Bank</h1>
      <div>
        <span id="welcome-msg"></span>
        <button id="logout-btn" onclick="logout()">Logout</button>
      </div>
    </div>

    <div class="dashboard">

      <!-- Balance Card -->
      <div class="card">
        <h2>Account Balance</h2>
        <p id="balance-display" class="balance">$0.00</p>
        <p id="account-number">Account: #000-000</p>
      </div>

      <!-- Deposit Card -->
      <div class="card">
        <h2>Deposit</h2>
        <div class="form-group">
          <label for="deposit-amount">Amount ($)</label>
          <input type="number" id="deposit-amount" placeholder="Enter amount" min="1" />
        </div>
        <button id="deposit-btn" onclick="deposit()">Deposit</button>
        <p id="deposit-msg" class="hidden"></p>
      </div>

      <!-- Withdraw Card -->
      <div class="card">
        <h2>Withdraw</h2>
        <div class="form-group">
          <label for="withdraw-amount">Amount ($)</label>
          <input type="number" id="withdraw-amount" placeholder="Enter amount" min="1" />
        </div>
        <button id="withdraw-btn" onclick="withdraw()">Withdraw</button>
        <p id="withdraw-msg" class="hidden"></p>
      </div>

      <!-- Transaction History -->
      <div class="card full-width">
        <h2>Transaction History</h2>
        <table id="transaction-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Type</th>
              <th>Amount</th>
              <th>Balance After</th>
              <th>Date & Time</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="transaction-body">
            <tr id="no-transactions">
              <td colspan="6">No transactions yet.</td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
